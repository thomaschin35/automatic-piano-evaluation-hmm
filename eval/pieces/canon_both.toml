# Pachelbel, Canon in D, arr. Jacob Danao: measures 1-8, both hands. RH rests m1-4, then half-note melody from m5.
# Broken-chord eighth notes over the ground bass D A Bm F#m G D G A (twice).
name = "canon_both"
title = "Canon in D (arr. Danao), measures 1-8, both hands"
time_signature = [4, 4]
bpm = 70

[hands]
RH = [
  ["rest", 16],               # m1-4
  ["F#5", 2], ["E5", 2],      # m5
  ["D5", 2], ["C#5", 2],      # m6
  ["B4", 2], ["A4", 2],       # m7
  ["B4", 2], ["C#5", 2],      # m8
]
