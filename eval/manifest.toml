# Every evaluated recording. Audio paths are relative to the repo root.
# Labels live at eval/labels/<piece>/<id>.toml. Every take that is labelled and not
# excluded is scored by `run` and `check`. (Old entries still carry a `split` field; it is ignored.)
# Add new takes with: python -m eval.cli sync   (or new-take <audio> --piece <piece>)

